name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # 3.9 is the oldest Python the README promises; 3.13 is what the Raspberry Pi runs.
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg  # for the encoder test that runs ffmpeg
      - run: python -m unittest discover -s tests
